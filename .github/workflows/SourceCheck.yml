# SourceCheck.yml
name: SourceCheck

on:
  push:
    paths:
    - 'src/**'
    - '**check_inl_sources.py'
    - '**SourceCheck.yml'
  pull_request:

  workflow_dispatch:

jobs:

  inl-sources:

    name: translation unit consistency

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Check the hubs and the *.inl files (SDL back end)
        run: |
          python3 .github/scripts/check_inl_sources.py \
            --hub src/lgfx/v1/lgfx_v1.cpp \
            --hub src/lgfx/v1/lgfx_v1_panel.cpp \
            --hub src/lgfx/v1/lgfx_v1_touch.cpp \
            --hub src/lgfx/v1/lgfx_v1_platforms.cpp \
            --source src/lgfx/v1/LGFXBase.cpp \
            --source src/lgfx/v1/lgfx_fonts.cpp \
            --source src/lgfx/v1/panel/Panel_M5HDMI.cpp \
            --source src/lgfx/v1/touch/Touch_GSLx680.cpp \
            --root src/lgfx/v1 --macro LGFX_V1_IMPLEMENTATION \
            --compile g++ -std=c++17 -DLGFX_SDL -Isrc $(sdl2-config --cflags)

      - name: Check the *.inl files (Linux framebuffer back end)
        run: |
          python3 .github/scripts/check_inl_sources.py \
            --hub src/lgfx/v1/lgfx_v1.cpp \
            --hub src/lgfx/v1/lgfx_v1_panel.cpp \
            --hub src/lgfx/v1/lgfx_v1_touch.cpp \
            --hub src/lgfx/v1/lgfx_v1_platforms.cpp \
            --source src/lgfx/v1/LGFXBase.cpp \
            --source src/lgfx/v1/lgfx_fonts.cpp \
            --source src/lgfx/v1/panel/Panel_M5HDMI.cpp \
            --source src/lgfx/v1/touch/Touch_GSLx680.cpp \
            --root src/lgfx/v1 --macro LGFX_V1_IMPLEMENTATION \
            --compile g++ -std=c++17 -DLGFX_LINUX_FB -Isrc
