
[coding_standards]
build_flags       =
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-sign-compare
    -Wunreachable-code
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion
    -Wformat
    -Wnonnull

[platform_default]
tasmota_2xx       = https://github.com/tasmota/platform-espressif32/releases/download/2023.11.01/platform-espressif32.zip
pioarduino        = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip


[esp32_2_0_3]
; oldest 2.x usable from PlatformIO (2.0.0-2.0.2 zips carry no PIO manifest);
; also the first release supporting ESP32-S3
platform          = ${platform_default.tasmota_2xx}
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.3/esp32-2.0.3.zip
build_flags       = ${coding_standards.build_flags}
[esp32_2_0_17]
; final release of the 2.x series
platform          = ${platform_default.tasmota_2xx}
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.17/esp32-2.0.17.zip
build_flags       = ${coding_standards.build_flags}
[esp32_3_0_6]
; oldest 3.x that compiles: 3.0.0-3.0.2 were never packaged for PlatformIO,
; and the cores up to 3.0.5 fail on their own esp32-hal-log.h (ets_printf)
platform          = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.06/platform-espressif32.zip
build_flags       = ${coding_standards.build_flags}



[esp32_default]
platform          = ${platform_default.pioarduino}
;platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.3/esp32-2.0.3.zip
build_flags       = ${coding_standards.build_flags}


[esp32]
board             = esp32dev
[M5StickC]
board             = m5stick-c
platform          = ${platform_default.tasmota_2xx}
[M5Stack]
board             = m5stack-core-esp32
[M5Core2]
board             = m5stack-core2
[M5CoreS3]
board             = esp32dev
board_build.mcu   = esp32s3
board_build.variant = esp32s3
; no rom binary available for dio/qio "default" 40MHz, why ??
board_build.f_flash = 80000000L
build_flags =
    ${env.build_flags}
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_UDB_MODE=1

[esp32c3]
board             = esp32dev
board_build.mcu   = esp32c3
build_flags       =
  -DDUMMY_DISPLAY
  ${coding_standards.build_flags}
[esp32s2]
board             = esp32dev
board_build.mcu   = esp32s2
[esp32s3]
; generic esp32s3 board has no "esp32-s3.json" default in pioarduino, why ??
board             = esp32dev
board_build.mcu   = esp32s3
board_build.variant = esp32s3
; no rom binary available for dio/qio "default" 40MHz, why ??
board_build.f_flash = 80000000L


; for some reason platformio 5.0 wants this
[env:esp32]
[env:m5stick-c]
[env:m5stack-core-esp32]
[env:m5stack-core2]
[env:m5stack-cores3]
[env:esp32-s2]
[env:esp32-s3]
[env:esp32-c3]



[env:m5stack-cores3-2_0_3]
extends          = M5CoreS3, esp32_2_0_3
[env:m5stack-cores3-2_0_17]
extends          = M5CoreS3, esp32_2_0_17
[env:m5stack-cores3-3_0_6]
extends          = M5CoreS3, esp32_3_0_6
[env:m5stack-cores3-default]
extends          = M5CoreS3, esp32_default


[env:esp32-2_0_3]
extends           = esp32, esp32_2_0_3
[env:esp32-2_0_17]
extends           = esp32, esp32_2_0_17
[env:esp32-3_0_6]
extends           = esp32, esp32_3_0_6
[env:esp32-default]
extends           = esp32, esp32_default

[env:m5stick-c-2_0_3]
extends           = M5StickC, esp32_2_0_3
[env:m5stick-c-2_0_17]
extends           = M5StickC, esp32_2_0_17
[env:m5stick-c-3_0_6]
extends           = M5StickC, esp32_3_0_6
; the 3.x cores renamed the variant folder to m5stack_stickc
board_build.variant = m5stack_stickc
[env:m5stick-c-default]
extends           = M5StickC, esp32_default
; the 3.x cores renamed the variant folder to m5stack_stickc
board_build.variant = m5stack_stickc


[env:m5stack-core-esp32-2_0_3]
extends           = M5Stack, esp32_2_0_3
[env:m5stack-core-esp32-2_0_17]
extends           = M5Stack, esp32_2_0_17
[env:m5stack-core-esp32-3_0_6]
extends           = M5Stack, esp32_3_0_6
; pioarduino JSON reports a wrong variant folder
board_build.variant = m5stack_core
[env:m5stack-core-esp32-default]
extends           = M5Stack, esp32_default
; pioarduino JSON reports a wrong variant folder
board_build.variant = m5stack_core

[env:m5stack-core2-2_0_3]
extends           = M5Core2, esp32_2_0_3
[env:m5stack-core2-2_0_17]
extends           = M5Core2, esp32_2_0_17
[env:m5stack-core2-3_0_6]
extends           = M5Core2, esp32_3_0_6
[env:m5stack-core2-default]
extends           = M5Core2, esp32_default

[env:esp32-c3-2_0_3]
extends           = esp32c3, esp32_2_0_3
[env:esp32-c3-2_0_17]
extends           = esp32c3, esp32_2_0_17
[env:esp32-c3-3_0_6]
extends           = esp32c3, esp32_3_0_6
[env:esp32-c3-default]
extends           = esp32c3, esp32_default

[env:esp32-s2-2_0_3]
extends           = esp32s2, esp32_2_0_3
[env:esp32-s2-2_0_17]
extends           = esp32s2, esp32_2_0_17
[env:esp32-s2-3_0_6]
extends           = esp32s2, esp32_3_0_6
[env:esp32-s2-default]
extends           = esp32s2, esp32_default

[env:esp32-s3-2_0_3]
extends           = esp32s3, esp32_2_0_3
[env:esp32-s3-2_0_17]
extends           = esp32s3, esp32_2_0_17
[env:esp32-s3-3_0_6]
extends           = esp32s3, esp32_3_0_6
[env:esp32-s3-default]
extends           = esp32s3, esp32_default
